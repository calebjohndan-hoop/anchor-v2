<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#E8792B"/></marker></defs><rect width="1600" height="920" fill="#F8FAFC"/><text x="60" y="62" style="font-family:Inter,Arial,sans-serif" font-size="34" font-weight="800" fill="#1F3864">ANCHOR v2: I2S wiring</text><text x="60" y="96" style="font-family:Inter,Arial,sans-serif" font-size="18" fill="#6B7280">Shared clocks, two mic data lines, one speaker data line. Same GPIO 5, 6, 7 and 15 as v1.</text><rect x="60" y="130" width="260" height="660" rx="10" fill="#E8EEF8" stroke="#1F3864" stroke-width="2.5"/><text x="80" y="170" style="font-family:Inter,Arial,sans-serif" font-size="24" font-weight="700" fill="#1F3864">ESP32-S3</text><text x="80" y="194" style="font-family:Inter,Arial,sans-serif" font-size="15" fill="#374151">WROOM-1-N16R8</text><text x="300" y="236" text-anchor="end" style="font-family:Inter,Arial,sans-serif" font-size="16" font-weight="700" fill="#1F3864">GPIO 5</text><line x1="320" y1="230" x2="1530" y2="230" stroke="#1F3864" stroke-width="4"/><text x="340" y="220" style="font-family:Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#1F3864">BCLK</text><text x="300" y="326" text-anchor="end" style="font-family:Inter,Arial,sans-serif" font-size="16" font-weight="700" fill="#1F3864">GPIO 6</text><line x1="320" y1="320" x2="1530" y2="320" stroke="#1F3864" stroke-width="4"/><text x="340" y="310" style="font-family:Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#1F3864">WS</text><text x="300" y="416" text-anchor="end" style="font-family:Inter,Arial,sans-serif" font-size="16" font-weight="700" fill="#2E7D32">GPIO 15</text><line x1="320" y1="410" x2="1530" y2="410" stroke="#2E7D32" stroke-width="4"/><text x="340" y="400" style="font-family:Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#2E7D32">DIN0  REF</text><text x="300" y="506" text-anchor="end" style="font-family:Inter,Arial,sans-serif" font-size="16" font-weight="700" fill="#7B1FA2">GPIO 16</text><line x1="320" y1="500" x2="1530" y2="500" stroke="#7B1FA2" stroke-width="4"/><text x="340" y="490" style="font-family:Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#7B1FA2">DIN1  ERR</text><text x="300" y="596" text-anchor="end" style="font-family:Inter,Arial,sans-serif" font-size="16" font-weight="700" fill="#E8792B">GPIO 7</text><line x1="320" y1="590" x2="1530" y2="590" stroke="#E8792B" stroke-width="4"/><text x="340" y="580" style="font-family:Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#E8792B">DOUT</text><text x="300" y="686" text-anchor="end" style="font-family:Inter,Arial,sans-serif" font-size="16" font-weight="700" fill="#C0392B">GPIO 8</text><line x1="320" y1="680" x2="1530" y2="680" stroke="#C0392B" stroke-width="4"/><text x="340" y="670" style="font-family:Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#C0392B">AMP_SD</text><line x1="560" y1="230" x2="560" y2="770" stroke="#9CA3AF" stroke-width="2.5"/><circle cx="560" cy="230" r="8" fill="#1F3864"/><line x1="560" y1="320" x2="560" y2="770" stroke="#9CA3AF" stroke-width="2.5"/><circle cx="560" cy="320" r="8" fill="#1F3864"/><line x1="560" y1="410" x2="560" y2="770" stroke="#9CA3AF" stroke-width="2.5"/><circle cx="560" cy="410" r="8" fill="#2E7D32"/><rect x="484" y="770" width="152" height="90" rx="10" fill="#fff" stroke="#2E7D32" stroke-width="2.5"/><text x="560.0" y="809.0" text-anchor="middle" style="font-family:Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#2E7D32">REF L</text><text x="560.0" y="835.0" text-anchor="middle" style="font-family:Inter,Arial,sans-serif" font-size="16" font-weight="400" fill="#374151">L/R to GND</text><line x1="720" y1="230" x2="720" y2="770" stroke="#9CA3AF" stroke-width="2.5"/><circle cx="720" cy="230" r="8" fill="#1F3864"/><line x1="720" y1="320" x2="720" y2