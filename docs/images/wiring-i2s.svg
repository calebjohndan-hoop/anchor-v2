<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#E8792B"/></marker></defs><rect width="1600" height="980" fill="#F8FAFC"/><text x="60" y="62" style="font-family:Inter,Arial,sans-serif" font-size="34" font-weight="800" fill="#1F3864">ANCHOR v2: I2S wiring (each ear wired like v1)</text><text x="60" y="96" style="font-family:Inter,Arial,sans-serif" font-size="18" fill="#6B7280">Two I2S ports. On each: REF mic = left slot (L/R low), ERR mic = right slot (L/R high), amp plays both slots. Left ear uses v1 pins.</text><rect x="60" y="130" width="250" height="780" rx="10" fill="#E8EEF8" stroke="#1F3864" stroke-width="2.5"/><text x="80" y="170" style="font-family:Inter,Arial,sans-serif" font-size="24" font-weight="700" fill="#1F3864">ESP32-S3</text><text x="80" y="194" style="font-family:Inter,Arial,sans-serif" font-size="15" fill="#374151">WROOM-1-N16R8</text><text x="340" y="218" style="font-family:Inter,Arial,sans-serif" font-size="18" font-weight="800" fill="#C0392B">LEFT EAR  (I2S port 0, main board)</text><text x="290" y="256" text-anchor="end" style="font-family:Inter,Arial,sans-serif" font-size="16" font-weight="700" fill="#1F3864">GPIO 5</text><line x1="310" y1="250" x2="1530" y2="250" stroke="#1F3864" stroke-width="4"/><text x="330" y="241" style="font-family:Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#1F3864">BCLK</text><text x="290" y="308" text-anchor="end" style="font-family:Inter,Arial,sans-serif" font-size="16" font-weight="700" fill="#1F3864">GPIO 6</text><line x1="310" y1="302" x2="1530" y2="302" stroke="#1F3864" stroke-width="4"/><text x="330" y="293" style="font-family:Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#1F3864">WS</text><text x="290" y="360" text-anchor="end" style="font-family:Inter,Arial,sans-serif" font-size="16" font-weight="700" fill="#2E7D32">GPIO 15</text><line x1="310" y1="354" x2="1530" y2="354" stroke="#2E7D32" stroke-width="4"/><text x="330" y="345" style="font-family:Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#2E7D32">DIN</text><text x="290" y="412" text-anchor="end" style="font-family:Inter,Arial,sans-serif" font-size="16" font-weight="700" fill="#E8792B">GPIO 7</text><line x1="310" y1="406" x2="1530" y2="406" stroke="#E8792B" stroke-width="4"/><text x="330" y="397" style="font-family:Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#E8792B">DOUT</text><line x1="700" y1="250" x2="700" y2="446" stroke="#9CA3AF" stroke-width="2.5"/><circle cx="700" cy="250" r="8" fill="#1F3864"/><line x1="700" y1="302" x2="700" y2="446" stroke="#9CA3AF" stroke-width="2.5"/><circle cx="700" cy="302" r="8" fill="#1F3864"/><line x1="700" y1="354" x2="700" y2="446" stroke="#9CA3AF" stroke-width="2.5"/><circle cx="700" cy="354" r="8" fill="#2E7D32"/><rect x="615" y="446" width="170" height="80" rx="10" fill="#fff" stroke="#2E7D32" stroke-width="2.5"/><text x="700.0" y="480.0" text-anchor="middle" style="font-family:Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#2E7D32">REF L</text><text x="700.0" y="506.0" text-anchor="middle" style="font-family:Inter,Arial,sans-serif" font-size="16" font-weight="400" fill="#374151">L/R to GND</text><line x1="1020" y1="250" x2="1020" y2="446" stroke="#9CA3AF" stroke-width="2.5"/><circle cx="1020" cy="250" r="8" fill="#1F3864"/><line x1="1020" y1="302" x2="1020" y2="446" stroke="#9CA3AF" stroke-width="2.5"/><circle cx="1020" cy="302" r="8" fill="#1F3864"/><line x1="1020" y1="354" x2="1020" y2="446" stroke="#9CA3AF" stroke-width="2.5"/><circle cx="1020" cy="354" r="8" fill="#2E7D32"/><rect x="935" y="446" width="170" height="80" rx="10" fill="#fff" stroke="#7B1FA2" stroke-width="2.5"/><text x="1020.0" y="480.0" text-anchor="middle" style="font-family:Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#7B1FA2">ERR L</text><t