font-size="18" font-weight="700" fill="#7B1FA2">ERR R</text><text x="1040.0" y="835.0" text-anchor="middle" style="font-family:Inter,Arial,sans-serif" font-size="16" font-weight="400" fill="#374151">L/R to 3V3</text><line x1="1200" y1="230" x2="1200" y2="770" stroke="#9CA3AF" stroke-width="2.5"/><circle cx="1200" cy="230" r="8" fill="#1F3864"/><line x1="1200" y1="320" x2="1200" y2="770" stroke="#9CA3AF" stroke-width="2.5"/><circle cx="1200" cy="320" r="8" fill="#1F3864"/><line x1="1200" y1="590" x2="1200" y2="770" stroke="#9CA3AF" stroke-width="2.5"/><circle cx="1200" cy="590" r="8" fill="#E8792B"/><line x1="1200" y1="680" x2="1200" y2="770" stroke="#9CA3AF" stroke-width="2.5"/><circle cx="1200" cy="680" r="8" fill="#C0392B"/><rect x="1124" y="770" width="152" height="90" rx="10" fill="#fff" stroke="#E8792B" stroke-width="2.5"/><text x="1200.0" y="809.0" text-anchor="middle" style="font-family:Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#E8792B">AMP L</text><text x="1200.0" y="835.0" text-anchor="middle" style="font-family:Inter,Arial,sans-serif" font-size="16" font-weight="400" fill="#374151">SD: 10 kΩ, left</text><line x1="1360" y1="230" x2="1360" y2="770" stroke="#9CA3AF" stroke-width="2.5"/><circle cx="1360" cy="230" r="8" fill="#1F3864"/><line x1="1360" y1="320" x2="1360" y2="770" stroke="#9CA3AF" stroke-width="2.5"/><circle cx="1360" cy="320" r="8" fill="#1F3864"/><line x1="1360" y1="590" x2="1360" y2="770" stroke="#9CA3AF" stroke-width="2.5"/><circle cx="1360" cy="590" r="8" fill="#E8792B"/><line x1="1360" y1="680" x2="1360" y2="770" stroke="#9CA3AF" stroke-width="2.5"/><circle cx="1360" cy="680" r="8" fill="#C0392B"/><rect x="1284" y="770" width="152" height="90" rx="10" fill="#fff" stroke="#E8792B" stroke-width="2.5"/><text x="1360.0" y="809.0" text-anchor="middle" style="font-family:Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#E8792B">AMP R (hub)</text><text x="1360.0" y="835.0" text-anchor="middle" style="font-family:Inter,Arial,sans-serif" font-size="16" font-weight="400" fill="#374151">SD: 220 kΩ, right</text><text x="60" y="878" style="font-family:Inter,Arial,sans-serif" font-size="15" fill="#6B7280">Mics share data lines in pairs: left mic on the left slot, right mic on the right slot. I2S0 drives the clocks; I2S1 reads ERR data as a slave</text><text x="60" y="898" style="font-family:Inter,Arial,sans-serif" font-size="15" fill="#6B7280">on the same BCLK and WS (bring-up test B1). AMP_SD low mutes both amps.</text></svg>